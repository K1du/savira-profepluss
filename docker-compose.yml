services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
    command: python manage.py runserver 0.0.0.0:8000
  frontend:
    build: ./frontend/frontend-app
    volumes:
      - ./frontend/frontend-app:/app
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    command: npm start
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: profepluss
      POSTGRES_PASSWORD: profepluss
      POSTGRES_DB: profepluss
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
